# Render Blueprint: one free Docker web service. The database is Neon (free Postgres).
services:
  - type: web
    name: deskreview
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_PASSWORD
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: FILE_STORAGE
        value: database
      - key: DEMO_LOGIN_ENABLED
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.6-flash
      - key: AI_TIMEOUT_SECONDS
        value: "30"
      - key: AI_HEDGE_SECONDS
        value: "4"
      - key: NUM_PROXIES
        value: "1"
      - key: LOG_LEVEL
        value: INFO
